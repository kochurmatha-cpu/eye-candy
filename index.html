<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>WM Theme Viewer</title>
<meta name="description" content="Drop .zip or .wmtheme.json files. Preview WM keyboard themes in your browser before importing." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="top">
  <a class="brand" href="#" id="brandLink">
    <span class="dot" aria-hidden="true"></span>
    <span>WM Theme Viewer</span>
  </a>
  <span class="pill" id="countPill">0 themes</span>
  <div class="spacer"></div>
  <button class="btn ghost sm" id="btnClear" title="Remove all themes from this browser">Clear all</button>
  <button class="btn primary sm" id="btnAdd">Add themes</button>
</header>

<main id="app" aria-live="polite"></main>

<input type="file" id="fileInput" multiple
       accept=".json,.wmtheme.json,.zip,application/json,application/zip" hidden />
<input type="file" id="dirInput" webkitdirectory directory multiple hidden />

<div id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
